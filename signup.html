<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luna & Leaf - Sign Up</title>

    <!-- Bootstrap CSS CDN -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Your Storefront CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="text-center py-4">
        <h1>Luna & Leaf</h1>
        <p>Natural beauty for your home</p>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Luna & Leaf</a>

            <button 
                class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#products">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="signup.html">Sign Up</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">Create an Account</h2>

                    <p class="text-center">
                        Sign up to become part of the Luna & Leaf community.
                    </p>

                    <form>

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>

                            <input 
                                type="text" 
                                class="form-control" 
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                required
                            >
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input 
                                type="email" 
                                class="form-control" 
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input 
                                type="password" 
                                class="form-control" 
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>

                            <input 
                                type="password" 
                                class="form-control" 
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >
                        </div>

                        <!-- Sign Up Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Sign Up
                            </button>
                        </div>

                    </form>

                    <div class="text-center mt-4">
                        <p>
                            Already have an account?
                            <a href="index.html">Return to Storefront</a>
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <p>&copy; 2026 Luna & Leaf. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
